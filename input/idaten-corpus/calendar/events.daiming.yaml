    \n### 2026-09-09（水）部活なし — 休養\n- 水は通年オフ。走らないでよい。\n\n### 2026-09-10（木）テスト休 — 休養\n\
    - 15–20分Eまで可。質禁止。\n\n### 2026-09-11（金）BG 17:00–18:30 — 再起動\n- 動きづくり＋ジョグ短＋**600m×3\
