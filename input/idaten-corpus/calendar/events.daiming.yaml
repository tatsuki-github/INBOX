    \ **〜10/2 スタミナ厚め**／**10/5〜 直前RP**  \n**部活枠**: 玉名市地域部活動【岱明中】陸上（長距離）  \n- **平日 BG練習**:\
    \ 17:00–18:30  \n- **休日（土・祝）BG練習**: 9:00–10:30  \n- **部活なしの日**: **休養 or 自主練**（質の自主練は原則禁止。するなら短いEのみ）\n\
    \n---\n\n## 0. 部活リズム（確定／想定）\n\n### 9月（地域部活カレンダーより確定）\n\n| 区分 | 日付 |\n|---|---|\n\
