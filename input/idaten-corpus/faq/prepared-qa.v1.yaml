- id: aragyoku-what
  questions:
  - 荒玉駅伝って何？
  - 荒玉中体連駅伝とは？
  - 荒玉駅伝について教えて
  answer: '荒玉駅伝は、玉名・荒尾地区の中体連駅伝（通称: 荒玉駅伝 / 荒玉中体連駅伝）です。男子は6区間、女子は5区間です。コース距離は年度によって変わり、男子は2024年に再編されています。

    '
