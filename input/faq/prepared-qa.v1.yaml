note: |
  想定質問への定型回答（ADR 059）。回答は正本ナレッジから確定した短文。
  ヒット時は本文をほぼそのまま返す。未ヒット時のみ RAG/LLM。
entries:
  - id: aragyoku-what
    questions:
      - 荒玉駅伝って何？
      - 荒玉中体連駅伝とは？
      - 荒玉駅伝について教えて
    answer: |
      荒玉駅伝は、玉名・荒尾地区の中体連駅伝（通称: 荒玉駅伝 / 荒玉中体連駅伝）です。男子は6区間、女子は5区間です。コース距離は年度によって変わり、男子は2024年に再編されています。
    sources:
      - out/analysis/aragyoku-overview.md
    tags: [aragyoku, meta]
  - id: aragyoku-2026-when
    questions:
      - 今年の荒玉はいつ？
      - 2026年の荒玉駅伝はいつ？
      - 荒玉中体連駅伝の日程は？
    answer: |
      2026年の荒玉中体連駅伝（玉名荒尾中体連駅伝）は 2026-10-14 です。予備日は 2026-10-15 です。
    sources:
      - input/events.2026.yaml
    tags: [aragyoku, schedule]
  - id: aragyoku-men-distance
    questions:
      - 荒玉男子の区間距離は？
      - 荒玉駅伝男子の距離を教えて
      - 男子の区間距離は？
    answer: |
      荒玉駅伝男子・現行（2024年以降）の区間距離は、1区3.00km、2区2.855km、3区3.00km、4区3.00km、5区2.855km、6区3.00km（合計17.71km）です。2023年以前は別定義です。
    sources:
      - docs/aragyoku-ekiden-distance-definitions.md
      - out/analysis/aragyoku-overview.md
    tags: [aragyoku, distance]
  - id: aragyoku-women-distance
    questions:
      - 荒玉女子の区間距離は？
      - 荒玉駅伝女子の距離は？
      - 女子の区間距離を教えて
    answer: |
      荒玉駅伝女子の区間距離は全年度共通で、1区3.00km、2区1.855km、3区2.00km、4区2.00km、5区3.00kmです。
    sources:
      - docs/aragyoku-ekiden-distance-definitions.md
    tags: [aragyoku, distance]
  - id: aragyoku-course-image
    questions:
      - 荒玉駅伝のコースの画像は？
      - コース図を見せて
      - 荒玉の共通ポイントの図
      - コース図解はどこ？
    answer: |
      荒玉駅伝の男女コース共通ポイント図解です（女子1〜5区・男子1〜6区が共有する地点）。
      https://drive.google.com/file/d/1j9iRk5WAnNVdMyO_fDJX5MaMAVDrESzG/view?usp=drivesdk
      詳細: 橋の上の1km、A/B/C/D/E、1周4.855km、男子スタートはCの145m手前。
    sources:
      - input/aragyoku/course-points.md
      - input/aragyoku/course-points.json
    tags: [aragyoku, course]
  - id: aragyoku-course-points-facts
    questions:
      - 荒玉のコース共通ポイントは？
      - 1周は何km？
      - 男子スタートはどこ？
    answer: |
      荒玉駅伝の男女共通ポイントは、女子1区の1km地点（橋の上）と D・E・A・B・C です。1周は4.855km、男子スタートはCの145m手前です。進行順は D → 1km（橋） → E → A → B → C → D です。
    sources:
      - input/aragyoku/course-points.md
    tags: [aragyoku, course]
