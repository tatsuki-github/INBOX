      銀マット・合同練習・保護者連絡などの運用メモは、コーパスの個人メモ・練習連絡を正本とします。具体的な日付や件名があると引けます。
    sources:
      - input/idaten-corpus/drive-text
    tags: [ops]
  - id: arita-practice
    questions:
      - 有田先輩の練習・補強の考え方は？
      - 有田先輩の補強は？
    answer: |
      有田先輩の練習・補強の考え方はコーパス内の関連メモ・資料を正本とします。該当ノートを指定して聞いてください。
    sources:
      - input/idaten-corpus/drive-text
    tags: [practice]
  - id: injury
    questions:
      - ケガ・障害は？
      - 怪我について教えて
      - RRIは？
    answer: |
      ケガ・障害（RRI）の一般論はコーパスの障害・回復系資料を案内します。個人の診断や治療方針は答えられません。症状がある場合はコーチ・医療機関に確認してください。
    sources:
      - docs/adr/016-kg-first-idaten-qa.md
    tags: [injury]
  - id: ai-practice
    questions:
      - AI で練習を作るには？
      - 練習メニューをAIで作りたい
    answer: |
      AI練習生成は docs/ai-practice-generation.md と ADR 001 の流れに従います。カレンダー・テンプレ・制約を入力に練習シートを生成します。
    sources:
      - docs/ai-practice-generation.md
      - docs/adr/001-ai-practice-generation-architecture.md
    tags: [ai, practice]
  - id: tamana-weather
    questions:
      - 玉名の天気データはどう更新する？
      - 天気データの更新は？
    answer: |
      玉名の天気データ更新手順はコーパス / 運用ドキュメントの tamana-weather 系を正本とします。一般の天気予報そのものは回答対象外です。
    sources:
      - docs/adr/016-kg-first-idaten-qa.md
    tags: [ops]
  - id: practice-daiming-mode
    questions:
      - 練習実績モードとは？
      - 実績入力モードは？
    answer: |
      2026-09-19以降、いだてん岱明の練習メニュー予定は実績入力モードへ移行しています（残り練習計画メモ参照）。予定の追加より実績の記録が中心です。
    sources:
      - input/events.2026.yaml
      - docs/adr/037-daiming-practice-actuals-mode.md
    tags: [practice]
  - id: daiming-club-schools
    questions:
      - 荒玉クラブ所属生徒の中学校は？
      - クラブ生徒の学校振分は？
    answer: |
      荒玉クラブ所属生徒の中学校振分メモは events のメモ「荒玉クラブ所属生徒の中学校」が正本です。不明は不明分類とします。
    sources:
      - input/events.2026.yaml
    tags: [ops]
  - id: competitor-analysis
    questions:
      - 荒玉競合分析は？
      - 競合分析を見せて
    answer: |
      荒玉競合分析メモは events / 分析資料を正本とします。学校名を指定するとチーム別 MD や SB ランキングと合わせて案内できます。
    sources:
      - input/events.2026.yaml
      - out/analysis/aragyoku_2024_2025_focus_teams.md
    tags: [analysis]
  - id: schedule-kumamoto-ekiden
    questions:
      - 熊本県駅伝の予定は？
      - 県駅伝はいつ？
    answer: |
      熊本県駅伝など県大会の日程は events YAML と大会フォルダを正本とします。大会名を具体的に指定してください。
    sources:
      - input/events.2026.yaml
    tags: [calendar]
  - id: gz-pace
    questions:
      - GZ / 閾値ペースは？
      - GZペースを教えて
      - 閾値ペースは？
    answer: |
      GZ（閾値）ペースは Daniels VDOT の T ペースから決定論的に導出します（ADR 008 / ADR 002）。VDOT やレースタイムを指定すると算出できます。例の対応: VDOT 53.7 → T 約4:01/km。
    sources:
      - docs/adr/008-daniels-vdot-gz-guidance.md
      - docs/adr/002-norwegian-method-integration.md
    tags: [pace, gz]
  - id: help-examples
    questions:
      - このボットは何ができる？
      - 使い方
      - 質問例を教えて
      - ヘルプ
    answer: |
      いだてん岱明の練習・大会・駅伝・記録について答えます。天気・ニュースなど外部の話題は対象外です。質問例: 「荒玉男子の区間距離は？」「2025年荒玉で岱明は何位？」「荒玉駅伝のコースの画像は？」「ジュニア駅伝の結果は？」「なごみ駅伝の結果のPDF渡して」。
    sources:
      - docs/adr/053-line-bot-help-examples.md
    tags: [meta, help]
  - id: out-of-scope
    questions:
      - 今日の天気は？
      - ニュースを教えて
      - 雑談しよう
    answer: |
      天気・一般ニュース・雑談は対象外です。いだてん岱明の練習・大会・駅伝・記録について具体的に聞いてください。
    sources:
      - docs/adr/015-line-idaten-qa-backend.md
    tags: [meta, scope]
  - id: coach-fallback-meaning
    questions:
      - コーチに直接聞いてくださいとは？
      - 分からないときは？
    answer: |
      コーパスに無い事実や個人の医療・連絡先などは「コーチに直接聞いてください。」と返します。定型回答や根拠ファイルがある質問では、その内容を優先して返します。
    sources:
      - docs/adr/015-line-idaten-qa-backend.md
    tags: [meta]
  - id: clarify-sb
    questions:
      - 自己ベストは？
      - SB教えて
    answer: |
      自己ベストは選手名と距離を書いてください。例: 「〇〇の1500m自己ベストは？」。曖昧な聞き方の場合は具体例を返します。
    sources:
      - docs/adr/021-clarify-concrete-examples.md
    tags: [sb, clarify]
  - id: norwegian
    questions:
      - ノルウェージャンメソッドとは？
      - Norwegian methodは？
    answer: |
      ノルウェージャンメソッド連携は ADR 002 を正本とします。GZ/T ペースは Daniels 系で決定論的に扱います。
    sources:
      - docs/adr/002-norwegian-method-integration.md
    tags: [pace]
  - id: kg-first
    questions:
      - ナレッジグラフとは？
      - どうやって答えを探す？
    answer: |
      回答はまず定型Q&A、次にナレッジグラフのルート地図、その後コーパス検索の順です。根拠パスを辿って答えます（ADR 016 / ADR 059）。
    sources:
      - docs/adr/016-kg-first-idaten-qa.md
      - docs/adr/059-prepared-qa-answers.md
    tags: [meta]
  - id: line-scope
    questions:
      - LINEで何が聞ける？
      - ボットの対象範囲は？
    answer: |
      答える範囲: いだてん岱明の練習・駅伝・記録・名簿・大会予定などコーパス内。答えない: 天気・一般雑談など。
    sources:
      - backend/README.md
      - docs/adr/015-line-idaten-qa-backend.md
    tags: [meta]
  - id: result-board-how
    questions:
      - 結果ボードの見方は？
      - ボード画像はどう返る？
    answer: |
      特定年の荒玉結果ボードは、年付き質問で LINE Image 最大2枚を添付します（ADR 043）。例: 「2025年荒玉男子の結果ボードを見せて」。
    sources:
      - docs/adr/043-aragyoku-line-board-images.md
    tags: [aragyoku, board]
  - id: course-video-how
    questions:
      - コース動画の聞き方は？
      - 動画はどうやって見る？
    answer: |
      「荒玉のコース動画はどこ？」「荒玉女子3区のコース動画を見せて」のように聞いてください。DriveフォルダURLと、可能ならLINE Videoを返します（ADR 044）。
    sources:
      - docs/adr/044-aragyoku-line-course-videos.md
      - input/aragyoku/course-videos.md
    tags: [aragyoku, course]
  - id: course-image-how
    questions:
      - コース画像の聞き方は？
      - コース図の聞き方
    answer: |
      「荒玉駅伝のコースの画像は？」「コース図を見せて」のように聞いてください。共通ポイント図解のDrive URLとLINE Imageを返します（ADR 058）。
    sources:
      - docs/adr/058-aragyoku-line-course-images.md
      - input/aragyoku/course-points.md
    tags: [aragyoku, course]
  - id: primary-pdf-how
    questions:
      - 結果PDFの聞き方は？
      - 一次資料リンクとは？
    answer: |
      結果・成績の質問で正本PDFがある場合、回答末尾に一次資料リンクを付けます（ADR 054）。例: 「なごみ駅伝の結果のPDF渡して」。
    sources:
      - docs/adr/054-primary-source-links-in-line-answers.md
    tags: [meta, pdf]
  - id: relative-year
    questions:
      - 去年と今年の意味は？
      - 相対年はどう解釈される？
    answer: |
      「去年」「今年」は日本の年度（4月始まり）と defaultYear に基づき西暦へ展開します。2026年度なら去年は2025年です。
    sources:
      - backend/src/domain/dates.ts
    tags: [meta]
  - id: prepared-qa-meta
    questions:
      - 定型回答とは？
      - 用意された回答は？
    answer: |
      想定質問にはあらかじめ用意した定型回答をほぼそのまま返します。ヒットしない場合のみ検索・生成します。正本は input/faq/prepared-qa.v1.yaml です（ADR 059）。
    sources:
      - docs/adr/059-prepared-qa-answers.md
      - input/faq/prepared-qa.v1.yaml
    tags: [meta]
  - id: data-update
    questions:
      - データ更新したらどうなる？
      - ナレッジを増やすには？
    answer: |
      大会結果やFAQを追加したら、events / 成績表を更新し、必要ならカレンダー生成・KG再生成・prepared-qa 追記と sync を行います。ナレッジが増えるほど定型回答のバリエーションも増やせます。
    sources:
      - AGENTS.md
      - docs/adr/059-prepared-qa-answers.md
    tags: [meta]
