- title: 予想ペース
  category: メモ
  status: inbox
  description: |
    【中長距離の簡易換算モデル】

    800m
    ↓ +5秒/km
    1000m
    ↓ +5秒/km
    1500m
    ↓ +15秒/km
    3000m
    ↓ +5秒/km
    5000m
    ↓ +6秒/km
    10000m
    ↓ +5秒/km
    ハーフマラソン


    【種目ごとの換算目安】

    1000m
    ＝ 800mの平均ペース +5秒/km

    1500m
    ＝ 1000mの平均ペース +5秒/km
    ＝ 800mの平均ペース +10秒/km

    3000m
    ＝ 1500mの平均ペース +15秒/km
    ＝ 1500m ×2 +30秒

    5000m
    ＝ 3000mの平均ペース +5秒/km
    ＝ 1500mの平均ペース +20秒/km

    10000m
    ＝ 5000mの平均ペース +6秒/km

    ハーフマラソン
    ＝ 10000mの平均ペース +5秒/km
    ＝ 5000mの平均ペース +10〜11秒/km


    【見方】

    換算より短い距離が強い
    → スピード型

    換算より長い距離が強い
    → 持久型


    【例】

    1500m 5:00（3:20/km）の場合

    800m    → 約2:32
    1000m   → 約3:15
    3000m   → 約10:45
    5000m   → 約18:20
    10000m  → 約37:40
    ハーフ → 約1:22〜1:24
  tags:
  - ランニング
- title: 伸び代について
  category: メモ
  status: inbox
  description: |
    伸び代を考えるなら、小中学時代は過度な走り込み、連日の高負荷練習や痛みのある状態での練習、厳しく細かい指導はしなくてもいい、いや、しない方がいいと思っている。
    長期積立投資みたいに、リスクを抑えた練習や生活を淡々と継続することが、やがて大きなリターンを生むと。


    小中学生だからたまにはサボりたいし、他人に反抗したくなるし、お菓子も食べたいし、遊びたいと思う。
    ただ、これが常態化すると当然マイナスのリターンになるので、その頻度を観察して多ければ指導する必要がある。いや、あえてスルーして小さく失敗させるのもアリ？


    高校以降で適切にリスクをとれるようになる、リスクのある環境に行ったら、またひと伸び。指導する上で目先の数字や目標に縛られすぎず、ローリスク思考（ゼロリスクではない）を重視。
  tags:
  - ランニング
