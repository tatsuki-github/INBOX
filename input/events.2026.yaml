    Lab 4.0 → train 2.3–3.0 for **4–6 months**
    
    ---
    
    ## 第14章：DLT深層生理学
    
    - Delayed stress: DOMS 24–72h → exploit 6–8h window
    - Radcliffe: economy −15%, speed@3mmol 16→21 km/h, VO2max stable
    - Easy runs: aerobic + economy + **tone↓**
    - Peaking: harder 4d out, TH 2d out, vol↓ final 2wk
    
    ---
    
    ## 第16章：高度
    
    | Use | Duration | Purpose |
    |---|---|---|
    | Specific load | 2–6wk early | TH pace↑ |
    | Periodization | 5–7 days | Kickstart |
    | Reactivation | 7–14 days | TH rebound |
    | Peaking | Post race-spec | Days 10–18 peak |
    
    Optimal: **~2000m (6500ft)** — lactate control essential
    
    ---
    
    ## 第17章：未来
    
    - Continuous lactate → real-time control, fartlek controllable
    - Triplet: lactate + HR + ventilation
    - Muscular measurement = blind spot
    - Shoes: individualization by session type
    - Fiber composition → observe and adapt
    
    ---
    
    # 最終部：コア原則総括
    
    ## 10原則
    
    1. 固定中心 = Golden Zone TH  
    2. 2.3–3.0 mmol/L, repeatable  
    3. 筋肉系 = ボトルネック  
    4. 予測可能回復  
    5. 精度 > 多様性  
    6. インターバル > 連続  
    7. Easy < 70% max HR  
    8. DLTH = 1 session, long break  
    9. 45/15 = min time max quality  
    10. 遷移を尊重 — boring on purpose  
    
    ## Start Where You Are
    
    > Find your Golden Zone. Train there regularly. Keep easy days easy. Be patient.
    
    ---
    
    ## 付録：Protocol Quick Reference
    
    ### Golden Zone
    - Lactate 2.3–3.0 | HR 80–87% | Short phrases OK
    
    ### 45/15
    ```
    15–30 × (45sec / 15sec), HR 80–95%, progressive 10K→5K
    ```
    
    ### DLTH
    ```
    AM: 6×6min TH (−5–10 sec/km start)
    PM: 20–25×1min TH
    Next 2 days: easy <70%
    ```
    
    ### Traffic Light
    🟢 +30–40% vol | 🟡 as planned | 🔴 stop
    
    ---
    
    ## 付録B：第5–6章 追加詳細（週間・周期化）
    
    ### Middle Model 完全週間表
    
    | Day | Session | 乳酸目安 | HR目安 |
    |---|---|---|---|
    | 月 | Rest or 30min very easy | — | <70% |
    | 火 | 6×6min TH, 1min rest | 2.3–3.0 | 80–87% |
    | 水 | 45–50min easy | — | <70% |
    | 木 | 4×10min TH, 1:30 rest | 2.3–3.0 | 80–87% |
    | 金 | Rest | — | — |
    | 土 | 15–18×45/15 progressive 10K→5K | 2.5–3.5 | 80–95% |
    | 日 | Long 75–85min easy | — | <70% |
    
    ### 隔週 DLTH 週間表
    
    | Day | Session |
    |---|---|
    | 火 AM | 6–8×5min TH, 1min rest |
    | 火 PM | 15–20×45/15 |
    | 木 | Shortened 3×8min TH |
    | 土 | Middle model X-session |
    | 日 | Long run |
    
    ### Block Periodization（2+1）
    
    | Week | Load | 内容 |
    |---|---|---|
    | 1–2 | 120% volume | 可能なら DLTH、TH volume max |
    | 3 | 70% volume | 1–2 session削減、overall load↓ |
    
    **Litmus test**: hard weeks で performance↑ → light week 後さらに↑。否则見直し。
    
    ### 100 Day Marathon Plan — Phase概要
    
    | Phase | 週 | 焦点 | 例セッション |
    |---|---|---|---|
    | 1: 5K/10K | 1–3 | interval emphasis | 4×800m, 8×(60-45-30-15), 10×2min TH |
    | 2: HM | 4–7 | continuous TH variants | 12+3+6+3+9+3+2+1 min continuous |
    | 3: Mara | Mara weeks | progressive long | 60min varying / 3.5h easy |
    | 4: Taper | 2–3 | vol↓, 20×1min reintro | — |
    | 5: Recovery | — | short intervals + rest | — |
    
    ### 5K X-session Progression 詳細
    
    | Week | Session | Rest | ペース | Finish |
    |---|---|---|---|---|
    | 7 before | 8–12×200–300m | 45–60sec | 3–5K | optional 45/15 |
    | 6 before | 6–10×400m | 1:00–1:30 | 3–5K | optional 45/15 |
    | 5 before | 4–6×800m | 2–3min | 3–5K | optional 45/15 |
    | 2–4 before | 4–6×1000m | 3min | 3–5K | 3–5×300m overspeed |
    | Week before | Reduced 1000m or 200–300m | — | — | conserve |
    
    ---
    
    ## 付録C：第7–8章 DLTH・45/15 完全Protocol
    
    ### DLTH 朝セッション詳細チェックリスト
    
    - [ ] WU 15–20min含む
    - [ ] WU HR記録（resting + warm-up HR比較）
    - [ ] 1本目: target −5–10 sec/km
    - [ ] 5–10min後: target pace if OK
    - [ ] 昼間: 立仕事・筋demanding activity 回避
    - [ ] 間: CHO+Protein 3:1 within 30min（マラ準備以外）
    - [ ] PM: 同じ主観/測定強度 — PM faster pace に惑わされない
    
    ### DLTH 年間周期 詳細
    
    | Phase | 期間 | DLTH頻度 | X-session | Easy rule |
    |---|---|---|---|---|
    | Base/Prep | 3–4mo | 1–2/week | Hill base | <70% strict |
    | Comp prep | 2–3mo | 1/week | Race-specific↑ | <70% |
    | Comp | 1–2mo | 0–1/week | Comp itself | <70% |
    | Transition | 4–6wk | rebuild gradually | reduce | <70% |
    
    ### 45/15 Combination Variant 完全手順
    
    | Step | Action |
    |---|---|
    | 1 | TM 15–20×45/15 |
    | 2 | 各rep +0.1 km/h |
    | 3 | 最後2–3 rep で限界手前 |
    | 4 | **2min完全rest** |
    | 5 | 5×45/15 @ 最終rep speed |
    | 6 | barely manage — これがabove-TH stimulus |
    
    ### 45/15 距離別 Protocol
    
    | 距離 | Reps | Intensity | Special |
    |---|---|---|---|
    | 800–1500m | 15–20 | Above TH, 3K pace | X-session role |
    | 5K–10K | 20–30 | Progressive 10K→5K | Standard |
    | HM | 25–30 or 60/20 | Lower relative, longer | Combination runs |
    | Mara | 60/20 variants | Sub-TH continuous mix | Post-easy 10–15×45/15 |
    
    ---
    
    ## 付録D：第9–11章 医学・OT 詳細
    
    ### Frandsen 2025 図解データ
    
    ```
    最長run 6km → 15km run = +128% injury risk
    10–30% longer = +64%
    30–100% longer = +52%
    ```
    
    ### 病後復帰 — 完全2週間スケジュール
    
    #### Week 1
    
    | Day | Session | Notes |
    |---|---|---|
    | 1–2 | Rest | Hydration, sleep |
    | 3 | 10–15min jog + 2–5 strides | Evaluate energy |
    | 4 | 20min + strides | If day3 OK |
    | 5 | 25min + 6–10 strides | — |
    | 6 | 10–15×45/15 moderate | Key reactivation |
    | 7 | 40min easy + strides | — |
    
    #### Week 2
    
    | Day | Session |
    |---|---|
    | 2–3 days | 30/30 or 45/15 or 1min/30sec — just under TH, progressive |
    | Remaining | Easy <70% |
    | Criteria met | Return to normal 3-key structure |
    
    ### OT Recovery Week Template
    
    | Day | Session |
    |---|---|
    | 1–2 | Complete rest (consecutive) |
    | 3 | 45/15 ×10–15 progressive |
    | 4 | Rest or 20min easy |
    | 5 | 30/30 progressive |
    | 6 | 15–20×60m hill strides progressive |
    | 7 | 20–30min easy |
    
    + Massage, hot baths when possible
    
    ### Blood Panel — OT時
    
    | Test | Purpose |
    |---|---|
    | Ferritin | Iron stores |
    | B12 + homocysteine/MMA | Functional B12 |
    | Vitamin D | Stress fracture risk |
    | TSH, free T4 | Thyroid |
    | CBC, metabolic panel | Systemic illness rule-out |
    | Testosterone, cortisol, CK | Optional — trend not single value |
    
    ### Stair Test + Traffic Light 統合フロー
    
    ```
    毎朝: 同一階段 → 大腿feel記録
         ↓
    Quality day前: RHR + HRV + stairs + WU HR
         ↓
    GREEN → extend 30–40%
    YELLOW → as planned
    RED → stop / 1 off + 1 easy
         ↓
    Session中: 5min WU TH + lactate/talk test
         ↓
    Type 1–5 classification → adjust real-time
    ```
    
    ---
    
    ## 付録E：第12–17章 深層詳細
    
    ### 歴史 — 主要人物と貢献
    
    | 人物 | 貢献 |
    |---|---|
    | Joe Newton | Lydiard volume + 25×400 weekly rhythm |
    | Peter Coe | DLTH, top-up weeks, hill 600–800m + 180–200m |
    | Sam Bell / Bob Kennedy | Elite environment, Kenyan intuition |
    | Per Halle | 1972 diary, 6min/10min winter sessions |
    | Frank Evertsen | Lactate project, altitude intro |
    | Leif Olav Alnes | Sprint consolidation, Karsten Warholm lactate data |
    | Gert Ingebrigtsen | DLTH systematization for 1500m |
    | Alex Stanton | Flat week structure (Paula Radcliffe) |
    
    ### Five Session Types — 乳酸曲線図解
    
    ```
    Type 1: ─────────  (flat in Golden Zone) → add minutes
    Type 2: ─────────  (flat, above zone) → ease pace/vol
    Type 3: ╱────────  (creeping up) → adjust NOW
    Type 4: ╱╱       (steep) → STOP
    Type 5: ∿∿∿      (erratic) → feel/breathing/45/15
    ```
    
    ### 乳酸採血 Protocol（完全版）
    
    | Step | Action |
    |---|---|
    | 1 | 汗を完全に拭う（finger/ear + hand/arm） |
    | 2 | Alcohol swab → 完全乾燥 |
    | 3 | Lancet prick |
    | 4 | **第1滴を拭い去る** |
    | 5 | 第2滴: 2–3mm round drop |
    | 6 | 10sec以内にsqueezing hard禁止 |
    | 7 | 同一site一貫使用（finger OR ear、混在禁止） |
    | 8 | Cold fingers → earlobe with helper |
    
    ### Double Threshold — Load Equation 数値
    
    | Metric | Single 6×10 | Split 2×3×10 |
    |---|---|---|
    | Lactate 1st half/session1 | 2.60 | 2.72 |
    | Lactate 2nd half/session2 | 3.01 | **2.14** |
    | HR drift | +5 bpm | **−6 to −8 bpm** (final 30min comparison) |
    | RPE | 13.4→14.8 | stable 13–14 |
    | Post supine HR 60min | 65 bpm | 61 bpm |
    | Next AM fatigue (1–10) | — | 8 vs 7 |
    | Next AM soreness | — | 7 vs 6 |
    
    ### 高度 — 4用途 Timeline
    
    ```
    1. Specific Load (early cycle, 2–6wk @ ~2000m)
       → Threshold pace rapid ↑, epigenetic memory
    
    2. Periodization Break (5–7 days)
       → Stress signal → 3–4 weeks gains at sea level
    
    3. Reactivation (7–14 days, mid-cycle)
       → TH sliding → aerobic recalibration
    
    4. Peaking (post race-specific work)
       → Neuromuscular + aerobic layer
       → Peak window: days 10–18 post-altitude
    ```
    
    ### Triathlon 4-day Altitude Cycle（Blummenfelt model）
    
    | Day | Session |
    |---|---|
    | 1 | 2×TH/double threshold + 1 easy |
    | 2 | Long easy 5–8h |
    | 3 | 2×TH + 1 easy |
    | 4 | Very easy ~2h choice |
    
    乳酸: 2.5–3.0 mmol/L — Golden Zone
    
    ### 未来技術 — 実装予測
    
    | Technology | Impact on Norwegian Method |
    |---|---|
    | Continuous lactate | Real-time Golden Zone lock, dynamic rest periods |
    | Wearable ventilation | Triplet completion with HR |
    | Daily muscle tone sensor | Close muscular blind spot |
    | Individualized shoes by session | Load management tool |
    | Fiber typing (MRI/genetic) | Phenotype-based TH/X balance |
    
    ---
    
    ## 付録F：用語集（日本語–English）
    
    | 日本語 | English | 定義 |
    |---|---|---|
    | Golden Zone | Golden Zone | 閾値直下 2.3–3.0 mmol/L |
    | ダブルスレッショルド | Double Threshold | 同日2 TH sessions |
    | 45/15 | 45/15 | 45sec work / 15sec rest |
    | X-session | X-Factor session | 週1可変・境界付き高強度 |
    | Drip load | Drip load | 最小有効量の非TH刺激 |
    | Muscle tone | Muscle tone | 筋のベースライン張力 |
    | Two horses | Two horses | 有氧/無氧エネルギー系選択 |
    | Top-up weeks | Top-up mileage weeks | 竞赛前 easy volume block |
    | Inflection point | Inflection point | 強度微増で筋反応急変の点 |
    | Grey zone | Grey zone | 70–80% max HR — 避ける |
    
    ---
    
