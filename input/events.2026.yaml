    ## F. 日別トレーニング計画
    
    ### 共通ルール（全日）
    
    **目的を毎回言う**: 開始時に「今日は脚を残す日／閾値を積む日／レースだ」のどれかを宣言。  
    **強度の上限**: 予定強度を超えて「勝ちにいくインターバル」は禁止（例外はレース）。  
    **変更トリガー**: 後述 H/I/K。  
    **周回目安**: 岱明トラック1周≈500–530m想定で記録上の「周」を踏襲。距離換算は現場計測に合わせる。  
    **朝練標準**: 4–5km ジョグ、RPE 2–3/10、会話しながら。流しは原則なし（夕に回す）。
    
    **グループ例（300mペース目安、暑さで+1〜2秒）**
    
    | 組 | 目安選手（例） | GZ 300m | GZ 600m相当 | イージー感じ |
    |---|---|---|---|---|
    | A | 松野、（山本の良い日） | 63–66秒 | 2:08–2:14 | 楽 |
    | B | 山本、田上、村上 | 66–69 | 2:14–2:20 | 楽〜やや楽 |
    | C | 高田、中尾、松本 等 | 69–72 | 2:20–2:28 | 楽 |
    | D | 山﨑、増岡、角田、田中、南本 等 | 72–76 | 2:28–2:36 | 楽 |
    | E | 塚原、導入期 | 76–82 | 2:36–2:48 | 楽 |
    
    ※固定ラベルではなく、**その日の調子で組を上げ下げ**する。
    
