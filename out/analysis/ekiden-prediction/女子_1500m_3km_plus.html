<!doctype html><html lang="ja"><meta charset="utf-8"><title>女子 1500m→3km 予測</title><style>body{font-family:system-ui,sans-serif;max-width:800px;margin:40px auto;padding:0 20px;color:#1f2937}section{background:#f7f8fa;border:1px solid #ddd;border-radius:12px;padding:20px}code{font-size:1.2em}</style><h1>女子：1500m SBから3km駅伝の予測</h1><section><p><strong>妥当な加算値（80%設定）：+64.27秒（+1:04.27）</strong></p><p><code>3km予測 = 1500m SB × 2 + 64.27秒</code></p><p>例：1500m SB 5:00.00 → 3km予測 11:04.27</p><p>過去の女子1500m SBと3km駅伝実績を同じ選手・年度で突合し、実績−1500m SB×2の80パーセンタイルを加算値としています。過去データの約80%がこの予測以内に収まる設定です。</p></section></html>
