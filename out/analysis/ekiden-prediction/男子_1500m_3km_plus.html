<!doctype html><html lang="ja"><meta charset="utf-8"><title>男子 1500m→3km 予測</title><style>body{font-family:system-ui,sans-serif;max-width:800px;margin:40px auto;padding:0 20px;color:#1f2937}section{background:#f7f8fa;border:1px solid #ddd;border-radius:12px;padding:20px}code{font-size:1.2em}</style><h1>男子：1500m SBから3km駅伝の予測</h1><section><p><strong>妥当な加算値（80%設定）：+68.30秒（+1:08.30）</strong></p><p><code>3km予測 = 1500m SB × 2 + 68.30秒</code></p><p>過去の同一選手・年度の1500m SBと、定義された3km区間（男子は年度により区間が異なるため、3km区間のみ）の実績から、実績−1500m SB×2の80パーセンタイルを加算値としています。</p></section></html>
