name: Knowledge Graph

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate knowledge graph is up to date
        run: python3 scripts/build_knowledge_graph.py --check

      - name: Schema-validate knowledge graph
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("schemas/knowledge-graph.schema.json").read_text(encoding="utf-8"))
          graph = json.loads(Path("out/knowledge-graph.json").read_text(encoding="utf-8"))
          Draft202012Validator(schema).validate(graph)
          print("schema OK", len(graph["nodes"]), "nodes", len(graph["edges"]), "edges")
          PY

      - name: Unit tests (knowledge graph)
        run: python3 -m pytest tests/test_knowledge_graph.py -q

      - name: Recheck prepared answers against source snapshots
        run: |
          python3 scripts/sync_prepared_qa.py --check
          python3 scripts/audit_prepared_qa_facts.py --check
          python3 scripts/generate_prepared_qa_edge_comparisons.py --check
          python3 -m pytest tests/test_prepared_qa_facts.py tests/test_prepared_qa_edge_comparisons.py -q

  prepared-comparisons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm test -- --run tests/preparedQa.test.ts tests/preparedQaConstraints.test.ts tests/preparedQaEdgeComparisons.test.ts
        working-directory: backend
