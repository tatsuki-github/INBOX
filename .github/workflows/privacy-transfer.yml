name: Publish verified privacy checkpoint
on:
  push:
    branches: [codex/complete-knowledge-qa-privacy]
    paths: [.codex-transfer/**]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import and publish verified objects
        env:
          TARGET_COMMIT: 86a63841683319bf35ebbaaa99c274d0a8e683b2
          TARGET_TREE: c75536705d2d084708f37059d21a2c73b8b7af0b
          BUNDLE_SHA256: 449a9dbc3aa3f2b886ddb92214ec1c12f0b1733725e1a2b4121fa98dd14e4c72
        run: |
          set -euo pipefail
          cat .codex-transfer/part-* > /tmp/checkpoint.bundle
          echo "$BUNDLE_SHA256  /tmp/checkpoint.bundle" | sha256sum -c -
          git bundle verify /tmp/checkpoint.bundle
          git bundle unbundle /tmp/checkpoint.bundle
          test "$(git rev-parse "$TARGET_COMMIT^{tree}")" = "$TARGET_TREE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git read-tree "$TARGET_TREE"
          while IFS= read -r file; do
            blob=$(git rev-parse "$GITHUB_SHA:$file")
            git update-index --add --cacheinfo "100644,$blob,$file"
          done < <(git ls-tree -r --name-only "$GITHUB_SHA" .codex-transfer .github/workflows/privacy-transfer.yml)
          tree=$(git write-tree)
          published=$(git commit-tree "$tree" -p "$GITHUB_SHA" -p "$TARGET_COMMIT" -m 'Publish verified source and QA checkpoint')
          git push origin "$published:refs/heads/codex/complete-knowledge-qa-privacy"
